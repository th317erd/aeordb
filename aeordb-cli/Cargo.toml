[package]
name = "aeordb-cli"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "aeordb"
path = "src/main.rs"

[[bin]]
name = "crash-soak-worker"
path = "src/bin/crash-soak-worker.rs"

[[bin]]
name = "soak-worker"
path = "src/bin/soak-worker.rs"

[[bin]]
name = "gc-bench"
path = "src/bin/gc-bench.rs"

[dependencies]
aeordb = { path = "../aeordb-lib" }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tokio = { workspace = true }
tokio-util = "0.7"
tower = "0.5"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
rand = "0.8"
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
blake3 = "1"
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }

[[test]]
name = "stress_spec"
path = "spec/stress_spec.rs"

[[test]]
name = "crash_inject_spec"
path = "spec/crash_inject_spec.rs"

[[test]]
name = "emergency_reset_spec"
path = "spec/emergency_reset_spec.rs"

[[test]]
name = "config_spec"
path = "spec/config_spec.rs"

[[test]]
name = "configuration_cli_spec"
path = "spec/configuration_cli_spec.rs"

[[test]]
name = "probe_spec"
path = "spec/probe_spec.rs"

[[test]]
name = "soak_checkpoint_spec"
path = "spec/soak_checkpoint_spec.rs"

[[test]]
name = "deployment_spec"
path = "spec/deployment_spec.rs"

[[test]]
name = "status_spec"
path = "spec/status_spec.rs"

[[test]]
name = "gc_cli_spec"
path = "spec/gc_cli_spec.rs"

[[test]]
name = "start_spec"
path = "spec/start_spec.rs"

[[test]]
name = "root_route_live_spec"
path = "spec/root_route_live_spec.rs"

[[test]]
name = "cutover_fault_spec"
path = "spec/cutover_fault_spec.rs"

[[test]]
name = "soak_worker_cli_spec"
path = "spec/soak_worker_cli_spec.rs"

[lints]
workspace = true
