[package]
name = "aeordb-v4-reference"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
blake3 = "1.8"
crc32fast = "1.5"
hex = "0.4"
regex = "=1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Keep the reference implementation independent from the AeorDB workspace.
[workspace]
