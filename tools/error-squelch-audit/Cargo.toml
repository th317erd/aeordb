[package]
name = "aeordb-error-squelch-audit"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
blake3 = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "parsing", "visit"] }
